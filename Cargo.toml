[package]
name = "oiio"
version = "0.2.1"
edition = "2021"
# The oldest toolchain CI actually builds and tests with. Older ones may well
# work; they are simply not verified, and cargo reporting that plainly beats a
# compile error somewhere in the middle of a dependency.
rust-version = "1.95"
description = "High-level OpenImageIO bindings over oiio-sys"
documentation = "https://docs.rs/oiio"
authors = [
    "KMean <kim.ranzani@gmail.com>",
    "Scott Wilson <scott@propersquid.com>",
    "David Aguilar <davvid@gmail.com>",
]
license = "Apache-2.0"
keywords = ["graphics", "images", "render", "texture", "vfx"]
categories = ["graphics", "multimedia::images", "rendering::data-formats"]
readme = "README.md"
homepage = "https://github.com/KMean/oiio-bind"
repository = "https://github.com/KMean/oiio-bind.git"

[workspace]
members = ["oiio-sys"]
# The viewer is a demonstration binary with windowing dependencies, kept out
# of the workspace so they never enter the library's dependency graph.
exclude = ["viewer"]

[workspace.dependencies]
anyhow = "1.0.80"
cxx = { version = "1.0.117", features = ["c++17"] }
proptest = "1.5.0"
half = "2.7.1"
thiserror = "1.0.57"

[dependencies]
cxx = { workspace = true }
half = { workspace = true }
oiio-sys = { path = "oiio-sys", version = "0.2.0" }
thiserror = { workspace = true }

# anyhow is only used by the integration tests, so it is not imposed on
# anything that depends on this crate.
[dev-dependencies]
anyhow = { workspace = true }
proptest = { workspace = true }
# The differential tests drive the raw C++ API through the sys bridge and
# compare it byte-for-byte against the safe crate.
oiio-sys = { path = "oiio-sys", version = "0.2.0" }

# The docs are the same across all platforms so we only need to build once.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustc-args = ["--cfg", "docsrs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
