name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Documentation and static analysis do not need to link OpenImageIO.
      DOCS_RS: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: quality

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  unix:
    name: ${{ matrix.name }} / OIIO 3.1.14
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - name: Install OpenImageIO
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: .github/ci/environment.yml
          cache-environment: true
          cache-downloads: true
          generate-run-shell: true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.os }}-oiio-3.1.14

      - name: Configure OpenImageIO discovery
        shell: micromamba-shell {0}
        run: |
          echo "PKG_CONFIG_PATH=$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          export PKG_CONFIG_PATH="$CONDA_PREFIX/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          pkg-config --modversion OpenImageIO

      - name: Run optimized tests
        shell: micromamba-shell {0}
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          else
            export DYLD_LIBRARY_PATH="$CONDA_PREFIX/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
            export DYLD_FALLBACK_LIBRARY_PATH="$CONDA_PREFIX/lib${DYLD_FALLBACK_LIBRARY_PATH:+:$DYLD_FALLBACK_LIBRARY_PATH}"
          fi
          test "$(pkg-config --modversion OpenImageIO)" = "3.1.14.1"
          cargo test --workspace --release --locked -- --nocapture

      # Debug assertions and overflow checks only exist in this profile, so
      # one platform runs it. Linux is the cheapest place to pay for the
      # second build.
      - name: Run debug tests
        if: runner.os == 'Linux'
        shell: micromamba-shell {0}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --workspace --locked -- --nocapture

  windows:
    name: Windows x86_64 / OIIO 3.1.14
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_TARGET_TRIPLET: x64-windows
      OIIO_VCPKG_TRIPLET: x64-windows
      VCPKGRS_DYNAMIC: "1"
      VCPKG_DISABLE_METRICS: "1"
      # Put vcpkg's built packages somewhere that can be cached between runs;
      # without this every run rebuilds OpenImageIO and its dependencies from
      # source, which is the whole cost of this job.
      #
      # The binary source is named explicitly rather than left to
      # VCPKG_DEFAULT_BINARY_CACHE: run-vcpkg sets VCPKG_BINARY_SOURCES for its
      # own caching, and once that is set the default cache location is
      # ignored. Setting it here won that argument; relying on the default
      # produced a 195-byte cache, which is an empty directory.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.95.0

      - name: Configure vcpkg paths
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "vcpkg"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$root"
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_INSTALLED_DIR=$root/installed"

      - name: Prepare the vcpkg binary cache
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      # Keyed on the vcpkg commit and the manifest, so a change to either
      # rebuilds; otherwise the built packages are restored and the install
      # step only unpacks them.
      # Restores before the install below, and saves in its post step, which is
      # the only order actions/cache can work in: it cannot archive a
      # directory until the job has filled it.
      #
      # Worth knowing when this misbehaves: a cache hit suppresses the save. An
      # entry saved empty under the wanted key therefore perpetuates itself,
      # since every later run restores nothing, rebuilds everything, and then
      # declines to save because the key already matched. Deleting the entry,
      # or changing the key, is the way out.
      - name: Cache built vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/vcpkg-binary-cache
          key: vcpkg-x64-windows-9e593bb-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-x64-windows-9e593bb-
            vcpkg-x64-windows-

      - name: Install OpenImageIO with vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg
          vcpkgGitCommitId: 9e593bb18ea69cc5095e012465dcd675a822ed0d
          runVcpkgInstall: true
          doNotCache: false

      # Say plainly whether the binary cache did anything, so a run that spent
      # a quarter of an hour rebuilding OpenImageIO is not mistaken for one
      # that restored it.
      - name: Report the vcpkg binary cache
        shell: pwsh
        run: |
          $cache = $env:VCPKG_DEFAULT_BINARY_CACHE
          $files = Get-ChildItem $cache -Recurse -File -ErrorAction SilentlyContinue
          $megabytes = [math]::Round((($files | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "vcpkg binary cache: $($files.Count) packages, $megabytes MB"
          if ($files.Count -eq 0) {
            Write-Host "::warning::the vcpkg binary cache is empty, so every run rebuilds from source"
          }

      - name: Configure OpenImageIO runtime
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "$env:VCPKG_INSTALLED_DIR/x64-windows/bin"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: windows-oiio-3.1.14

      # Only the optimized suite here. The debug suite, which is what exercises
      # debug assertions and overflow checks, runs on Linux, where a second
      # build costs seconds rather than minutes.
      - name: Run optimized tests
        run: cargo test --workspace --release --locked -- --nocapture
